<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Sign in</title>
<style>
  :root { --brand: #73213b; --bg: #f6f4f2; --card: #fff; --ink: #222; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181a; --card: #222427; --ink: #eee; --muted: #aaa; --line: #3a3c40; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 16px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 320px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  input { width: 100%; font-size: 28px; letter-spacing: .4em; text-align: center; padding: 10px; border: 1px solid var(--line);
          border-radius: 8px; background: transparent; color: inherit; }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button { margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  #err { color: #c0392b; min-height: 1.4em; margin: 10px 0 0; font-size: 13px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Magnolia Admin</h1>
  <p>Enter the PIN</p>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autofocus aria-label="PIN">
  <button id="go">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
(function () {
  var SALT = "magnolia-app-v1", ITER = 150000;
  var f = document.getElementById('f'), pin = document.getElementById('pin'), go = document.getElementById('go'), err = document.getElementById('err');
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (!/^\/(?!\/)/.test(next) || /^\/login/.test(next)) next = '/';
  f.addEventListener('submit', async function (e) {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Checking…';
    try {
      var te = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', te.encode(pin.value.trim()), 'PBKDF2', false, ['deriveBits']);
      var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: te.encode(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
      var key = await crypto.subtle.importKey('raw', bits, 'AES-CBC', false, ['decrypt']);
      var buf = new Uint8Array(await (await fetch('/_app/check.bin', { cache: 'no-cache' })).arrayBuffer());
      var ok = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: buf.slice(0, 16) }, key, buf.slice(16)));
      if (ok !== 'magnolia-ok') throw new Error('bad');
      localStorage.setItem('mg-app-key', Array.from(bits).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''));
      document.cookie = 'mg-app=1; Max-Age=31536000; Path=/; Secure; SameSite=Lax';
      location.replace(next);
    } catch (x) {
      err.textContent = 'That PIN didn’t work.'; pin.value = ''; pin.focus();
      go.disabled = false; go.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
